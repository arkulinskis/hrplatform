<div class="ui hr-dlg">
  <anvil-component type="Label" name="heading" prop:role='["dlg-title"]'></anvil-component>
  <div class="hr-form-stack">
    <label class="ui-field"><span>Kind</span><anvil-component type="DropDown" name="kind"></anvil-component></label>
    <label class="ui-field"><span>Item</span><anvil-component type="TextBox" name="item_name" prop:placeholder="e.g. MacBook Air 13"></anvil-component></label>
    <label class="ui-field"><span>Serial number <em>(optional)</em></span><anvil-component type="TextBox" name="serial"></anvil-component></label>
    <anvil-component type="Label" name="message" prop:role='["msg-error"]' prop:visible="false"></anvil-component>
  </div>
  <div class="hr-dlg-actions">
    <anvil-component type="Button" name="cancel_button" prop:text="Cancel" prop:role='["btn", "btn-ghost"]'></anvil-component>
    <anvil-component type="Button" name="save_button" prop:text="Record it" prop:role='["btn", "btn-primary"]'></anvil-component>
  </div>
</div>
