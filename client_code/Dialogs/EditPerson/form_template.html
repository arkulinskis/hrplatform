<div class="ui hr-dlg hr-edit-person">
  <anvil-component type="Label" name="heading" prop:role='["dlg-title"]'></anvil-component>
  <div class="hr-form-stack">
    <div anvil:name="personal_part" class="hr-form-stack">
      <div class="hr-fields2">
        <label class="ui-field"><span>First name</span><anvil-component type="TextBox" name="first_name"></anvil-component></label>
        <label class="ui-field"><span>Last name</span><anvil-component type="TextBox" name="last_name"></anvil-component></label>
        <label class="ui-field"><span>Preferred name <em>(optional)</em></span><anvil-component type="TextBox" name="preferred_name"></anvil-component></label>
        <label class="ui-field"><span>Pronouns <em>(optional)</em></span><anvil-component type="TextBox" name="pronouns" prop:placeholder="e.g. she/her"></anvil-component></label>
        <label class="ui-field"><span>Personal email</span><anvil-component type="TextBox" name="personal_email"></anvil-component></label>
        <label class="ui-field"><span>Phone</span><anvil-component type="TextBox" name="phone"></anvil-component></label>
        <label class="ui-field"><span>Birthday</span><anvil-component type="TextBox" name="birthday"></anvil-component></label>
      </div>
      <label class="ui-field"><span>Address</span><anvil-component type="TextArea" name="address" prop:height="70"></anvil-component></label>
      <label class="ui-field"><span>About <em>(everyone in the company sees this)</em></span><anvil-component type="TextArea" name="about" prop:height="80"></anvil-component></label>
      <p class="hr-group-title">Emergency contact</p>
      <div class="hr-fields2">
        <label class="ui-field"><span>Name</span><anvil-component type="TextBox" name="em_name"></anvil-component></label>
        <label class="ui-field"><span>Relationship</span><anvil-component type="TextBox" name="em_relation"></anvil-component></label>
        <label class="ui-field"><span>Phone</span><anvil-component type="TextBox" name="em_phone"></anvil-component></label>
      </div>
    </div>
    <div anvil:name="job_part" class="hr-form-stack">
      <div class="hr-fields2">
        <label class="ui-field"><span>Job title</span><anvil-component type="TextBox" name="title"></anvil-component></label>
        <label class="ui-field"><span>Work email</span><anvil-component type="TextBox" name="work_email"></anvil-component></label>
        <label class="ui-field"><span>Team</span><anvil-component type="DropDown" name="department"></anvil-component></label>
        <label class="ui-field"><span>Location</span><anvil-component type="DropDown" name="location"></anvil-component></label>
        <label class="ui-field"><span>Manager</span><anvil-component type="DropDown" name="manager"></anvil-component></label>
        <label class="ui-field"><span>Employment type</span><anvil-component type="DropDown" name="employment_type"></anvil-component></label>
        <label class="ui-field"><span>Start date</span><anvil-component type="TextBox" name="start_date"></anvil-component></label>
        <label class="ui-field"><span>Access</span><anvil-component type="DropDown" name="role"></anvil-component></label>
      </div>
    </div>
    <div anvil:name="pay_part" class="hr-form-stack">
      <div class="hr-fields2">
        <label class="ui-field"><span>Pay rate</span><anvil-component type="TextBox" name="pay_rate" prop:type="number"></anvil-component></label>
        <label class="ui-field"><span>Per</span><anvil-component type="DropDown" name="pay_period"></anvil-component></label>
        <label class="ui-field"><span>Currency</span><anvil-component type="DropDown" name="pay_currency"></anvil-component></label>
      </div>
    </div>
    <div anvil:name="notes_part">
      <label class="ui-field"><span>HR notes <em>(HR admins only)</em></span><anvil-component type="TextArea" name="hr_notes" prop:height="180"></anvil-component></label>
    </div>
    <label class="ui-field" anvil:name="eff_part"><span>Takes effect on</span><anvil-component type="TextBox" name="effective"></anvil-component></label>
    <anvil-component type="Label" name="message" prop:role='["msg-error"]' prop:visible="false"></anvil-component>
  </div>
  <div class="hr-dlg-actions">
    <anvil-component type="Button" name="cancel_button" prop:text="Cancel" prop:role='["btn", "btn-ghost"]'></anvil-component>
    <anvil-component type="Button" name="save_button" prop:text="Save changes" prop:role='["btn", "btn-primary", "ic-check"]'></anvil-component>
  </div>
</div>
