<div class="ui hr-dlg to-req">
  <h2 class="dlg-h">Request time off</h2>
  <p class="hr-lede">Only working days count: weekends and company holidays are left out. Your manager gets the request to approve.</p>
  <div class="hr-form-stack">
    <div anvil:name="person_field">
      <label class="ui-field"><span>Who is taking time off</span>
        <anvil-component type="DropDown" name="person_drop" prop:role='["to-req-person"]'></anvil-component>
      </label>
      <anvil-component type="Label" name="person_note" prop:role='["fine-print"]' prop:text="Time off you enter for someone else is approved straight away."></anvil-component>
    </div>
    <label class="ui-field"><span>Type of time off</span>
      <anvil-component type="DropDown" name="type_drop" prop:role='["to-req-type"]'></anvil-component>
    </label>
    <div class="hr-fields2">
      <label class="ui-field"><span>First day</span>
        <anvil-component type="TextBox" name="start_box" prop:role='["to-req-start"]'></anvil-component>
      </label>
      <label class="ui-field"><span>Last day</span>
        <anvil-component type="TextBox" name="end_box" prop:role='["to-req-end"]'></anvil-component>
      </label>
    </div>
    <anvil-component type="Label" name="count_label" prop:role='["to-req-count"]' prop:text="Choose the first and last day to see how many working days it takes."></anvil-component>
    <label class="ui-field"><span>Note <em>(optional)</em></span>
      <anvil-component type="TextArea" name="note_box" prop:placeholder="Anything your manager should know, e.g. a family trip" prop:height="80"></anvil-component>
    </label>
    <anvil-component type="Label" name="message" prop:role='["msg-error"]' prop:visible="false"></anvil-component>
  </div>
  <div class="hr-dlg-actions">
    <anvil-component type="Button" name="cancel_button" prop:text="Cancel" prop:role='["btn", "btn-ghost"]'></anvil-component>
    <anvil-component type="Button" name="send_button" prop:text="Send request" prop:role='["btn", "btn-primary", "ic-plane", "to-req-send"]'></anvil-component>
  </div>
</div>
