<div class="ui hr-dlg to-decide">
  <h2 class="dlg-h">Decline this request?</h2>
  <anvil-component type="Label" name="summary" prop:role='["to-decide-sum"]'></anvil-component>
  <div class="hr-form-stack">
    <label class="ui-field"><span>Note to them <em>(optional)</em></span>
      <anvil-component type="TextArea" name="note_box" prop:placeholder="e.g. We're short-staffed that week. Could you move it to the week after?" prop:height="90"></anvil-component>
    </label>
    <anvil-component type="Label" name="message" prop:role='["msg-error"]' prop:visible="false"></anvil-component>
  </div>
  <div class="hr-dlg-actions">
    <anvil-component type="Button" name="cancel_button" prop:text="Keep it waiting" prop:role='["btn", "btn-ghost"]'></anvil-component>
    <anvil-component type="Button" name="decline_button" prop:text="Decline request" prop:role='["btn", "btn-danger", "ic-x", "to-decide-go"]'></anvil-component>
  </div>
</div>
