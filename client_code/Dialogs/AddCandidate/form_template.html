<div class="ui hr-dlg hi-addcand">
  <h2 class="dlg-h">Add a candidate</h2>
  <anvil-component type="Label" name="job_line" prop:role='["hr-sub"]'></anvil-component>
  <div class="hr-form-stack">
    <div class="hr-fields2">
      <label class="ui-field"><span>Name</span>
        <anvil-component type="TextBox" name="name_box"></anvil-component>
      </label>
      <label class="ui-field"><span>Email <em>(optional)</em></span>
        <anvil-component type="TextBox" name="email_box" prop:type="email"></anvil-component>
      </label>
      <label class="ui-field"><span>Phone <em>(optional)</em></span>
        <anvil-component type="TextBox" name="phone_box" prop:type="tel"></anvil-component>
      </label>
      <label class="ui-field"><span>Where they came from</span>
        <anvil-component type="DropDown" name="source_box"></anvil-component>
      </label>
    </div>
    <label class="ui-field"><span>CV, LinkedIn or portfolio link <em>(optional)</em></span>
      <anvil-component type="TextBox" name="link_box" prop:type="url" prop:placeholder="https://"></anvil-component>
    </label>
    <label class="ui-field"><span>Cover letter or notes <em>(optional)</em></span>
      <anvil-component type="TextArea" name="cover_box" prop:height="110"></anvil-component>
    </label>
    <anvil-component type="Label" name="message" prop:role='["msg-error"]' prop:visible="false"></anvil-component>
  </div>
  <div class="hr-dlg-actions">
    <anvil-component type="Button" name="cancel_button" prop:text="Cancel" prop:role='["btn", "btn-ghost"]'></anvil-component>
    <anvil-component type="Button" name="save_button" prop:text="Add candidate" prop:role='["btn", "btn-primary", "ic-plus"]'></anvil-component>
  </div>
</div>
