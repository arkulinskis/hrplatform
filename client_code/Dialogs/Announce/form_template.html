<div class="ui hr-dlg dc-dlg-ann">
  <h2 class="dlg-h">Post an announcement</h2>
  <p class="hr-lede dc-flat">Everyone sees it on their home page and under Policies and news.</p>
  <div class="hr-form-stack">
    <label class="ui-field"><span>Title</span>
      <anvil-component type="TextBox" name="title_box" prop:placeholder="e.g. Office closed on Friday"></anvil-component>
    </label>
    <label class="ui-field"><span>Message <em>(optional)</em></span>
      <anvil-component type="TextArea" name="body_box" prop:placeholder="The details people need to know." prop:height="140"></anvil-component>
    </label>
    <anvil-component type="CheckBox" name="pinned_box" prop:text="Pin it to the top"></anvil-component>
    <anvil-component type="Label" name="message" prop:role='["msg-error"]' prop:visible="false"></anvil-component>
  </div>
  <div class="hr-dlg-actions">
    <anvil-component type="Button" name="cancel_button" prop:text="Cancel" prop:role='["btn", "btn-ghost"]'></anvil-component>
    <anvil-component type="Button" name="save_button" prop:text="Post announcement" prop:role='["btn", "btn-primary", "ic-megaphone"]'></anvil-component>
  </div>
</div>
