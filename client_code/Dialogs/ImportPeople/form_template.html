<div class="ui hr-dlg st-import">
  <h2 class="dlg-h">Import people</h2>
  <p class="hr-lede">Copy the rows from your spreadsheet (with the header row) and paste them here. Commas, tabs and semicolons all work. Dates are YYYY-MM-DD.</p>
  <div class="hr-form-stack">
    <label class="ui-field"><span>Spreadsheet rows</span>
      <anvil-component type="TextArea" name="csv_box" prop:height="200" prop:role='["st-import-text"]' prop:placeholder="First name,Last name,Email,Title,Department,Start date&#10;Ana,Silva,ana@example.com,Designer,Design,2026-12-01"></anvil-component>
    </label>
    <div class="st-import-tools">
      <anvil-component type="Button" name="preview_button" prop:text="Preview" prop:role='["btn", "ic-eye", "st-import-preview"]'></anvil-component>
      <anvil-component type="Button" name="template_button" prop:text="Download the CSV template" prop:role='["btn", "btn-ghost", "ic-download"]'></anvil-component>
    </div>
    <anvil-component type="Label" name="message" prop:role='["msg-error"]' prop:visible="false"></anvil-component>
    <div anvil:name="preview_part" class="st-import-preview-box">
      <anvil-component type="Label" name="summary" prop:role='["strong", "st-import-sum"]'></anvil-component>
      <anvil-component type="Label" name="mapped" prop:role='["fine-print"]'></anvil-component>
      <div class="st-imp-list" tabindex="0" aria-label="Preview of the rows to import">
        <anvil-component type="RepeatingPanel" name="rows_panel" prop:item_template="HR_Platform.Items.ImportRow" prop:role='["st-imp-rows"]'></anvil-component>
      </div>
    </div>
  </div>
  <div class="hr-dlg-actions">
    <anvil-component type="Button" name="cancel_button" prop:text="Cancel" prop:role='["btn", "btn-ghost"]'></anvil-component>
    <anvil-component type="Button" name="import_button" prop:text="Import people" prop:role='["btn", "btn-primary", "ic-upload", "st-import-go"]' prop:enabled="false"></anvil-component>
  </div>
</div>
