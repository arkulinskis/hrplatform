<div class="ui hr-dlg hr-terminate">
  <anvil-component type="Label" name="heading" prop:role='["dlg-title"]'></anvil-component>
  <p class="muted">Their profile stays (people who left are kept for your records). An offboarding checklist is created, and their reports move to their manager.</p>
  <div class="hr-form-stack">
    <div class="hr-fields2">
      <label class="ui-field"><span>Last working day</span><anvil-component type="TextBox" name="end_date"></anvil-component></label>
      <label class="ui-field"><span>Reason</span><anvil-component type="DropDown" name="reason"></anvil-component></label>
    </div>
    <label class="ui-check"><anvil-component type="CheckBox" name="regretted" prop:text="Regretted (we wanted them to stay)"></anvil-component></label>
    <label class="ui-check"><anvil-component type="CheckBox" name="rehire" prop:checked="true" prop:text="Eligible for rehire"></anvil-component></label>
    <label class="ui-field"><span>Private note <em>(HR only)</em></span><anvil-component type="TextArea" name="note" prop:height="80"></anvil-component></label>
    <anvil-component type="Label" name="message" prop:role='["msg-error"]' prop:visible="false"></anvil-component>
  </div>
  <div class="hr-dlg-actions">
    <anvil-component type="Button" name="cancel_button" prop:text="Cancel" prop:role='["btn", "btn-ghost"]'></anvil-component>
    <anvil-component type="Button" name="save_button" prop:text="Start offboarding" prop:role='["btn", "btn-danger", "btn-solid"]'></anvil-component>
  </div>
</div>
