<div class="ui hr-dlg pfx-dlg-cycle">
  <h2 class="dlg-h">Start a review cycle</h2>
  <p class="hr-lede pfx-flat">Everyone who has started writes a self-review, and each manager reviews the people who report to them.</p>
  <div class="hr-form-stack">
    <div class="hr-fields2">
      <label class="ui-field"><span>Name</span>
        <anvil-component type="TextBox" name="name_box" prop:placeholder="e.g. Spring 2027 reviews"></anvil-component>
      </label>
      <label class="ui-field"><span>Due date</span>
        <anvil-component type="TextBox" name="due_box"></anvil-component>
      </label>
    </div>
    <label class="ui-field"><span>Questions <em>(one per line, up to 8)</em></span>
      <anvil-component type="TextArea" name="questions_box" prop:height="150"></anvil-component>
    </label>
    <anvil-component type="Label" name="message" prop:role='["msg-error"]' prop:visible="false"></anvil-component>
  </div>
  <div class="hr-dlg-actions">
    <anvil-component type="Button" name="cancel_button" prop:text="Cancel" prop:role='["btn", "btn-ghost"]'></anvil-component>
    <anvil-component type="Button" name="save_button" prop:text="Start the cycle" prop:role='["btn", "btn-primary", "ic-check"]'></anvil-component>
  </div>
</div>
