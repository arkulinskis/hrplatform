<div class="ui hr-dlg dc-dlg-policy">
  <anvil-component type="Label" name="heading" prop:role='["dlg-title"]' prop:text="New policy"></anvil-component>
  <div class="hr-form-stack">
    <label class="ui-field"><span>Title</span>
      <anvil-component type="TextBox" name="title_box" prop:placeholder="e.g. Remote work policy"></anvil-component>
    </label>
    <label class="ui-field"><span>Policy text</span>
      <anvil-component type="TextArea" name="body_box" prop:placeholder="Write it the way you'd explain it to a new colleague. Blank lines start a new paragraph." prop:height="300"></anvil-component>
    </label>
    <anvil-component type="CheckBox" name="ack_box" prop:text="Everyone needs to acknowledge it" prop:checked="true"></anvil-component>
    <anvil-component type="Label" name="note" prop:role='["fine-print"]' prop:visible="false" prop:text="Saving changes asks everyone to acknowledge it again."></anvil-component>
    <anvil-component type="Label" name="message" prop:role='["msg-error"]' prop:visible="false"></anvil-component>
  </div>
  <div class="hr-dlg-actions">
    <anvil-component type="Button" name="cancel_button" prop:text="Cancel" prop:role='["btn", "btn-ghost"]'></anvil-component>
    <anvil-component type="Button" name="save_button" prop:text="Save policy" prop:role='["btn", "btn-primary", "ic-check"]'></anvil-component>
  </div>
</div>
