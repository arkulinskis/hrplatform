<div class="hi-notewrap">
<div class="hi-note" anvil:name="row">
  <span class="hi-note-dot" aria-hidden="true"></span>
  <div class="hi-note-txt">
    <anvil-component type="Label" name="text" prop:role='["hi-note-text"]' bind:text="self.item.get('text', '')"></anvil-component>
    <anvil-component type="Label" name="meta" prop:role='["fine-print"]'></anvil-component>
  </div>
</div>
</div>
