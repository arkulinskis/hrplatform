<div class="pfx-q">
  <anvil-component type="Label" name="question" prop:role='["strong", "pfx-q-text"]'></anvil-component>
  <label class="ui-field pfx-q-field" anvil:name="field">
    <span class="pfx-sr">Your answer</span>
    <anvil-component type="TextArea" name="answer_box" prop:placeholder="Write your answer" prop:height="120"></anvil-component>
  </label>
  <anvil-component type="Label" name="answer_text" prop:role='["pfx-answer"]' prop:visible="false"></anvil-component>
</div>
