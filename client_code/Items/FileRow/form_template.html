<div class="hr-file">
  <i class="ic ic-file"></i>
  <div class="hr-prow-txt">
    <anvil-component type="Label" name="name" prop:role='["strong", "hr-name"]' bind:text="self.item['name']"></anvil-component>
    <anvil-component type="Label" name="meta" prop:role='["fine-print"]'></anvil-component>
  </div>
  <anvil-component type="Button" name="open_button" prop:text="Download" prop:role='["btn", "btn-sm", "ic-download"]'></anvil-component>
  <anvil-component type="Button" name="delete_button" prop:text="Delete file" prop:role='["btn", "btn-sm", "btn-icon", "btn-ghost", "ic-trash", "sr-text"]'></anvil-component>
</div>
