    <script type="application/ld+json">{"@context": "https://schema.org", "@graph": [{"@type": "Service", "@id": "https://hr-platform.anvil.app/#app", "name": "HR Platform", "url": "https://hr-platform.anvil.app/", "description": "Employee records, org chart, time off, hiring with a careers page, onboarding, reviews, eNPS and HR reports in one private workspace for small companies.", "image": "https://hr-platform.anvil.app/_/theme/og-image.png", "serviceType": "All your people, one calm place.", "provider": {"@id": "https://arkvital.com/#org"}, "areaServed": "Worldwide", "availableChannel": {"@type": "ServiceChannel", "serviceUrl": "https://hr-platform.anvil.app/", "name": "Web browser", "availableLanguage": "en"}, "audience": {"@type": "Audience", "audienceType": "HR people, founders and managers at companies of 5 to 500 people"}}, {"@type": "WebSite", "@id": "https://hr-platform.anvil.app/#site", "url": "https://hr-platform.anvil.app/", "name": "HR Platform", "publisher": {"@id": "https://arkvital.com/#org"}}, {"@type": "Organization", "@id": "https://arkvital.com/#org", "name": "Arkvital", "url": "https://arkvital.com", "email": "arkvital@outlook.com", "address": {"@type": "PostalAddress", "addressLocality": "Montreal", "addressRegion": "QC", "addressCountry": "CA"}}]}</script>
    <noscript><div class="seo-noscript">
    <h1>HR Platform: HR software for small teams</h1>
    <p>Employee records, org chart, time off, hiring with a careers page, onboarding, reviews, eNPS and HR reports in one private workspace for small companies.</p>
    <p>HR Platform keeps one record per person and builds every HR task on it: job and pay history with effective dates, time off with approvals, hiring with a public careers page, onboarding and offboarding checklists, review cycles, goals, kudos, an anonymous eNPS pulse, policies people acknowledge and announcements.</p>
    <p>Pay and personal details are private by role: colleagues see the basics, managers see their own people, HR sees everything and can preview the app as anyone. A new workspace starts with a sample company to explore, and the whole company can be exported in one click.</p>
    <p>Who it's for: HR people, founders and managers at companies of 5 to 500 people</p>
    <h2>What it does</h2><ul><li>Employee profiles with effective-dated job and pay history</li><li>Org chart drawn from reporting lines, with open roles</li><li>Time off in working days, approvals and a who&#x27;s-out calendar</li><li>Hiring pipeline, public careers page and one-click hire</li><li>Onboarding and offboarding checklists by role</li><li>Review cycles, goals, kudos and an anonymous eNPS pulse</li><li>Policies with acknowledgements, and announcements</li><li>Reports and a payroll export for any period</li><li>Spreadsheet import, full data export and a sample company to explore</li></ul>
    <h2>Questions</h2><h3>Does HR Platform run payroll?</h3><p>No. It gives you a clean payroll export for any period (pay, changes, paid and unpaid days off) for your payroll provider.</p><h3>Who can see salaries?</h3><p>Only the person, the managers above them and HR. Colleagues see name, job, team, work email and birthday day.</p><h3>Are pulse surveys anonymous?</h3><p>Yes. Answers are stored without names and results only show after three people answer.</p><h3>Can I try it before adding my real people?</h3><p>Yes. A new workspace can start with a 26-person sample company that you remove in one click.</p>
    <p><a href="https://hr-platform.anvil.app/about">About HR Platform</a> &middot; <a href="https://hr-platform.anvil.app/llms.txt">HR Platform for AI assistants</a> &middot; Made by <a href="https://arkvital.com">Arkvital</a>, Montreal, Canada. HR Platform needs JavaScript in your browser.</p>
    </div></noscript>
    <!-- seo:end -->
